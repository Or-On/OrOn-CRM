name: or-on-platform

services:
  postgres:
    image: postgres:18.6-bookworm
    profiles: ["core"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-or_on_platform_dev}
      POSTGRES_USER: ${POSTGRES_USER:-platform_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - platform-postgres-data:/var/lib/postgresql
      - ../../db/bootstrap/development_roles.sql:/docker-entrypoint-initdb.d/010-development-roles.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    networks: [platform-private]

  control-api:
    profiles: ["core"]
    build:
      context: ../..
      dockerfile: services/py/control-api/Dockerfile
    restart: unless-stopped
    environment:
      PLATFORM_ENV: development
      PLATFORM_SERVICE: control-api
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTROL_API_BIND_HOST: 0.0.0.0
      DATABASE_URL: postgresql://platform_web:platform-web-dev-only@postgres:5432/${POSTGRES_DB:-or_on_platform_dev}
      VOICE_DATABASE_URL: postgresql://platform_voice:platform-voice-dev-only@postgres:5432/${POSTGRES_DB:-or_on_platform_dev}
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:?AUTH_SERVICE_SECRET is required}
      ENABLE_REAL_TELEPHONY: "false"
      ENABLE_REAL_WHATSAPP: "false"
    ports:
      - "127.0.0.1:${CONTROL_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s
    networks: [platform-private]

  web:
    profiles: ["core"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      PLATFORM_ENV: development
      PLATFORM_SERVICE: web
      CONTROL_API_URL: http://control-api:8000
      DATABASE_URL: postgresql://platform_web:platform-web-dev-only@postgres:5432/${POSTGRES_DB:-or_on_platform_dev}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:?AUTH_TOKEN_PEPPER is required}
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:?AUTH_SERVICE_SECRET is required}
      AUTH_DUMMY_PASSWORD_HASH: ${AUTH_DUMMY_PASSWORD_HASH:?AUTH_DUMMY_PASSWORD_HASH is required}
      AUTH_COOKIE_SECURE: "false"
      ENABLE_REAL_TELEPHONY: "false"
      ENABLE_REAL_WHATSAPP: "false"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s
    networks: [platform-private]

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    profiles: ["voice"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s
    networks: [platform-private]

  livekit:
    image: livekit/livekit-server:v1.13.6@sha256:e37d68f172556d02aa77968b9fc55ef481468c0315fa38e4fa6c56ce72e3a815
    profiles: ["voice"]
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 8s
    stop_grace_period: 20s
    networks: [platform-private]

  livekit-sip:
    image: livekit/sip:v1.13.0@sha256:80bf1f5b2563d75febfb24ebe0601ebc5073810223a24709850c2ba5391558d3
    profiles: ["voice"]
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      LIVEKIT_WS_URL: ws://livekit:7880
    volumes:
      - ./livekit/sip.yaml:/sip/config.yaml:ro
    expose:
      - "5060/udp"
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/bash",
          "-ec",
          "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 8s
    stop_grace_period: 20s
    networks: [platform-private]

networks:
  platform-private:
    driver: bridge

volumes:
  platform-postgres-data:
    name: or-on-platform-postgres-data
