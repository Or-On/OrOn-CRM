# Cloud-neutral single-host deployment. Images are supplied as immutable OCI
# digest references; credentials remain in private host files outside the repo.
name: oron-platform

x-service: &service
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 200
  cpus: 1.5
  mem_limit: 1g
  stop_grace_period: 45s
  logging:
    driver: local
    options: { max-size: 10m, max-file: "3" }

x-provider-flags: &provider-flags
  ENABLE_REAL_WHATSAPP: ${ENABLE_REAL_WHATSAPP:-false}
  ENABLE_REAL_TELEPHONY: ${ENABLE_REAL_TELEPHONY:-false}
  ENABLE_REAL_VOICE_PROVIDERS: ${ENABLE_REAL_VOICE_PROVIDERS:-false}
  ENABLE_WHATSAPP_AI: ${ENABLE_WHATSAPP_AI:-false}
  ENABLE_WHATSAPP_AUTO_CALLS: ${ENABLE_WHATSAPP_AUTO_CALLS:-false}
  ENABLE_REAL_BILLING: ${ENABLE_REAL_BILLING:-false}

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    environment:
      POSTGRES_DB: or_on_platform
      POSTGRES_USER: platform_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - ${DEPLOYMENT_DATA_DIR:?Set an absolute persistent data directory}/postgres:/var/lib/postgresql
    command:
      [
        "postgres",
        "-c",
        "max_connections=100",
        "-c",
        "statement_timeout=30000",
        "-c",
        "lock_timeout=5000",
        "-c",
        "idle_in_transaction_session_timeout=60000",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_migrator -d or_on_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options: { max-size: 10m, max-file: "3" }
    stop_grace_period: 60s
    networks: [database]

  migrator:
    <<: *service
    image: ${MIGRATOR_IMAGE:?Set an immutable migrator image digest}
    restart: "no"
    profiles: [release]
    env_file:
      - path: ${DEPLOYMENT_CONFIG_DIR:?Set an absolute private config directory}/migrator.env
        format: raw
    environment:
      PLATFORM_ENV: production
    depends_on: { postgres: { condition: service_healthy } }
    networks: [database]
    read_only: true
    tmpfs: [/tmp]

  control-api:
    <<: *service
    image: ${CONTROL_API_IMAGE:?Set an immutable control-api image digest}
    env_file:
      - path: ${DEPLOYMENT_CONFIG_DIR}/control-api.env
        format: raw
    environment:
      <<: *provider-flags
      PLATFORM_ENV: production
      CONTROL_API_BIND_HOST: 0.0.0.0
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ${DEPLOYMENT_DATA_DIR}/objects:/var/lib/oron/objects:ro
    networks: [database, application, egress]

  dispatcher:
    <<: *service
    image: ${DISPATCHER_IMAGE:?Set an immutable dispatcher image digest}
    profiles: [voice]
    env_file:
      - path: ${DEPLOYMENT_CONFIG_DIR}/dispatcher.env
        format: raw
    environment:
      <<: *provider-flags
      PLATFORM_ENV: production
      DISPATCHER_BIND_HOST: 0.0.0.0
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ${DEPLOYMENT_DATA_DIR}/objects:/var/lib/oron/objects
    networks: [database, application, egress]

  messaging-worker:
    <<: *service
    stop_grace_period: 90s
    image: ${MESSAGING_WORKER_IMAGE:?Set an immutable messaging-worker image digest}
    profiles: [workers]
    env_file:
      - path: ${DEPLOYMENT_CONFIG_DIR}/messaging-worker.env
        format: raw
    environment:
      <<: *provider-flags
      PLATFORM_ENV: production
      CONTROL_API_URL: http://control-api:8000
      DISPATCHER_URL: http://dispatcher:8082
    depends_on:
      postgres: { condition: service_healthy }
      control-api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    networks: [database, application, egress]

  web:
    <<: *service
    image: ${WEB_IMAGE:?Set an immutable web image digest}
    env_file:
      - path: ${DEPLOYMENT_CONFIG_DIR}/web.env
        format: raw
    environment:
      <<: *provider-flags
      PLATFORM_ENV: production
      NODE_ENV: production
      AUTH_COOKIE_SECURE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CONTROL_API_URL: http://control-api:8000
      DISPATCHER_URL: http://dispatcher:8082
      PUBLIC_SITE_URL: ${PLATFORM_ORIGIN:?Set the canonical HTTPS origin}
    depends_on: { control-api: { condition: service_healthy } }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    networks: [database, application, edge]

  caddy:
    <<: *service
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    user: "65532:65532"
    mem_limit: 256m
    cap_add: [NET_BIND_SERVICE]
    environment:
      PLATFORM_ORIGIN: ${PLATFORM_ORIGIN}
      TLS_CONTACT_EMAIL: ${TLS_CONTACT_EMAIL:?Set a TLS contact email}
    ports: ["80:80", "443:443"]
    volumes:
      - ../caddy/Caddyfile.deployment:/etc/caddy/Caddyfile:ro
      - ${DEPLOYMENT_DATA_DIR}/caddy:/data
    tmpfs: [/config, /tmp]
    read_only: true
    depends_on: { web: { condition: service_healthy } }
    networks: [edge]

networks:
  database: { internal: true }
  application: { internal: true }
  egress: {}
  edge: {}

secrets:
  postgres_password:
    file: ${DEPLOYMENT_CONFIG_DIR}/postgres-password.txt
