[project]
name = "or-on-dispatcher-runtime"
version = "0.1.0"
description = "Host entrypoint for the retained Or-on dispatcher"
requires-python = ">=3.14,<3.15"
dependencies = [
  "or-on-platform-integration==0.1.0",
  "oron-dispatcher==0.1.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
voice = ["oron-agent==0.1.0"]

[project.scripts]
or-on-dispatcher-runtime = "dispatcher_runtime.main:main"

[build-system]
requires = ["uv-build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
or-on-platform-integration = { workspace = true }
oron-agent = { path = "../../../packages/py/oron-agent", editable = true }
oron-dispatcher = { workspace = true }

[tool.uv.build-backend]
module-name = "dispatcher_runtime"
