name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      [
        main,
        codex/phase-1-foundation,
        codex/phase-2a-postgres-offline,
        codex/phase-2b-postgres-live,
      ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENABLE_REAL_TELEPHONY: "false"
  ENABLE_REAL_WHATSAPP: "false"
  ENABLE_REAL_VOICE_PROVIDERS: "false"
  ENABLE_WHATSAPP_AI: "false"
  ENABLE_WHATSAPP_AUTO_CALLS: "false"
  ORON_RUN_PROVIDER_EVALS: "false"

jobs:
  typescript:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ebd50bdde86241dd1b03a5b0a54a71aee9a1ca80 # v6.0.1
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: Python workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deployment-contract pytest cases execute the typed configuration
      # renderer; install its pinned Node runtime and workspace dependencies.
      - uses: pnpm/action-setup@ebd50bdde86241dd1b03a5b0a54a71aee9a1ca80 # v6.0.1
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.7
          python-version: 3.14.7
          enable-cache: true
      - run: uv sync --all-packages --locked --group voice
      # `infra` is linted with the rest: the deployment host helpers declare
      # their own py312 target, and `make lint` already includes them.
      - run: uv run ruff format --check packages/py services/py db infra scripts
      - run: uv run ruff check packages/py services/py db infra scripts
      - run: >-
          uv run pyrefly check packages/py/oron-common/src packages/py/oron-db/src
          packages/py/oron-flows/src packages/py/oron-hebrew/src
          packages/py/oron-agent/src packages/py/oron-secrets/src
          packages/py/oron-sessions/src packages/py/oron-tenancy/src
          packages/py/platform-integration/src services/py/control-api/src
          services/py/dispatcher/src services/py/voice-agent/src db/importers
          db/alembic/env.py db/alembic/oron_migration_compat.py db/seeds scripts
      - run: uv run pytest -p no:cacheprovider
      - run: uv run python scripts/pip_audit.py

  database:
    name: PostgreSQL and Alembic
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: or_on_platform_ci
          POSTGRES_USER: platform_migrator
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_migrator -d or_on_platform_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
      readiness-postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: oron_readiness
          POSTGRES_USER: platform_migrator
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U platform_migrator -d oron_readiness"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://platform_migrator:ci-only-password@127.0.0.1:5432/or_on_platform_ci
      TEST_DATABASE_URL: postgresql://platform_migrator:ci-only-password@127.0.0.1:5432/or_on_platform_ci
      READINESS_POSTGRES_URL: postgresql://platform_migrator:ci-only-password@127.0.0.1:55439/oron_readiness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.7
          python-version: 3.14.7
      # PostgreSQL integration tests exercise the production voice lead tool
      # layer directly, so install the root voice dependency group here too.
      - run: uv sync --all-packages --locked --group voice
      - run: uv run python scripts/db_verify.py offline
      - run: uv run alembic -c db/alembic/alembic.ini upgrade head
      - run: uv run alembic -c db/alembic/alembic.ini current --check-heads
      - run: uv run pytest -p no:cacheprovider db/tests/test_migration_graph.py db/tests/postgres
      - uses: pnpm/action-setup@ebd50bdde86241dd1b03a5b0a54a71aee9a1ca80 # v6.0.1
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages publish compiled `dist` entry points. Build the
      # worker's complete dependency closure so this diagnostic is valid from
      # a clean checkout instead of relying on stale local build artifacts.
      - run: pnpm --filter @or-on/messaging-worker... build
      - name: Field-service web-role acceptance (no providers)
        env:
          CRM_TEST_DATABASE_URL: postgresql://platform_migrator:ci-only-password@127.0.0.1:5432/or_on_platform_ci
        run: >-
          pnpm --filter @or-on/crm exec vitest run
          src/field-service.postgres.test.ts
      - name: Comprehensive isolated TypeScript PostgreSQL acceptance (no providers)
        env:
          MIGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: uv run --no-sync python scripts/preview_ui.py --check-db
      - name: Isolated WhatsApp diagnostic persistence (mocked HTTP)
        env:
          MIGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: uv run --no-sync python scripts/preview_ui.py --check-messaging
      # Named explicitly rather than by glob: a suite that silently stops
      # running is worse than one that fails, and `describe.skipIf` on a missing
      # variable makes that invisible in the summary.
      - name: Isolated cross-channel worker acceptance (no providers)
        env:
          CROSS_CHANNEL_TEST_DATABASE_URL: postgresql://platform_migrator:ci-only-password@127.0.0.1:5432/or_on_platform_ci
        run: >-
          pnpm --filter @or-on/messaging-worker exec vitest run
          tests/ai-reply.live.test.ts tests/call-followup.live.test.ts
          tests/support-tickets.live.test.ts tests/post-call.live.test.ts
          tests/lead-capture.live.test.ts tests/inbox-removal.live.test.ts
      - name: Initialize dedicated readiness PostgreSQL
        env:
          DATABASE_URL: ${{ env.READINESS_POSTGRES_URL }}
        run: |
          uv run --no-sync alembic -c db/alembic/alembic.ini upgrade head
          DEV_AUTH_PASSWORD_HASH="$(
            cd packages/ts/auth
            node --input-type=module \
              --eval "import { randomBytes } from 'node:crypto'; import { hash } from '@node-rs/argon2'; console.log(await hash(randomBytes(32).toString('base64url'), { algorithm: 2, memoryCost: 65536, timeCost: 3, parallelism: 1, outputLen: 32 }))"
          )" uv run --no-sync python db/seeds/seed_development.py
      - name: Dedicated readiness persistence acceptance (no providers)
        run: |
          pnpm --filter @or-on/crm exec vitest run \
            src/agent-quality.postgres.test.ts \
            src/handoff-idempotency.postgres.test.ts
          pnpm --filter @or-on/messaging-worker exec vitest run \
            tests/readiness.live.test.ts

  contracts:
    name: Contract freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ebd50bdde86241dd1b03a5b0a54a71aee9a1ca80 # v6.0.1
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.7
          python-version: 3.14.7
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: pnpm contracts:check

  architecture-security:
    name: Architecture and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ebd50bdde86241dd1b03a5b0a54a71aee9a1ca80 # v6.0.1
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.7
          python-version: 3.14.7
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: uv run python scripts/check_repository.py
      - run: uv run python scripts/check_secrets.py
      - run: uv run python scripts/check_docs.py
      - run: pnpm peers check
      - run: pnpm audit --audit-level critical
      - run: uv run python scripts/pip_audit.py

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Validate core and optional voice Compose profiles
        env:
          AUTH_DUMMY_PASSWORD_HASH: ci-fixture-hash
          AUTH_SERVICE_SECRET: ci-not-a-secret-auth-value-32-characters
          AUTH_TOKEN_PEPPER: ci-not-a-secret-pepper-value-32-characters
          LIVEKIT_API_KEY: ci-local-key
          LIVEKIT_API_SECRET: ci-not-a-secret-livekit-value-32-characters
        run: |
          docker compose --env-file .env.example -f infra/compose/compose.yaml --profile core config
          docker compose --env-file .env.example -f infra/compose/compose.yaml --profile voice config
      - name: Validate portable deployment topology
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/oron-config"
          data="$RUNNER_TEMP/oron-data"
          mkdir -p "$config" "$data/postgres" "$data/caddy" "$data/objects"
          for template in infra/deployment/config/*.env.template; do
            cp "$template" "$config/$(basename "${template%.template}")"
          done
          printf '%s' 'ci-only-postgres-password' > "$config/postgres-password.txt"
          printf '%s' 'ci-only-owner-password' > "$config/owner-password.txt"
          digest="sha256:$(printf 'a%.0s' {1..64})"
          DEPLOYMENT_CONFIG_DIR="$config" DEPLOYMENT_DATA_DIR="$data" \
          DEPLOYMENT_DATABASE_NAME="dev_oron_ci" \
          PLATFORM_ORIGIN="https://deployment.example.invalid" \
          TLS_CONTACT_EMAIL="operator@example.invalid" \
          WEB_IMAGE="example.invalid/oron/web@$digest" \
          CONTROL_API_IMAGE="example.invalid/oron/control-api@$digest" \
          MESSAGING_WORKER_IMAGE="example.invalid/oron/messaging-worker@$digest" \
          DISPATCHER_IMAGE="example.invalid/oron/dispatcher@$digest" \
          MIGRATOR_IMAGE="example.invalid/oron/migrator@$digest" \
          docker compose -f infra/compose/deployment.yaml \
            --profile release --profile workers --profile voice config --quiet
      - run: docker build --build-arg ORON_SOURCE_REVISION="$GITHUB_SHA" --file services/py/control-api/Dockerfile --tag or-on/control-api:ci .
      - run: docker build --build-arg ORON_SOURCE_REVISION="$GITHUB_SHA" --file apps/web/Dockerfile --tag or-on/web:ci .
      - run: docker build --build-arg ORON_SOURCE_REVISION="$GITHUB_SHA" --file infra/images/messaging-worker.Dockerfile --tag or-on/messaging-worker:ci .
      - run: docker build --build-arg ORON_SOURCE_REVISION="$GITHUB_SHA" --file infra/images/dispatcher.Dockerfile --tag or-on/dispatcher:ci .
      - run: docker build --build-arg ORON_SOURCE_REVISION="$GITHUB_SHA" --file infra/images/migrator.Dockerfile --tag or-on/migrator:ci .
      - name: Authenticate to Google Cloud for immutable DEV images
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/157867817612/locations/global/workloadIdentityPools/github-oron-dev/providers/oron-crm-main
          service_account: oron-github-dev@website-478708.iam.gserviceaccount.com
      - name: Configure the regional Artifact Registry
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Publish immutable DEV images
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          REGISTRY: me-west1-docker.pkg.dev/website-478708/or-on-platform
        run: |
          set -Eeuo pipefail
          gcloud auth configure-docker me-west1-docker.pkg.dev --quiet
          for service in web control-api messaging-worker dispatcher migrator; do
            docker tag "or-on/${service}:ci" "${REGISTRY}/${service}:${GITHUB_SHA}"
            docker push "${REGISTRY}/${service}:${GITHUB_SHA}"
          done

  deploy-dev:
    name: Deploy GCP DEV
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      [
        typescript,
        python,
        database,
        contracts,
        architecture-security,
        containers,
      ]
    runs-on: ubuntu-latest
    env:
      DEV_VM: oron-dev
      GCP_PROJECT_ID: website-478708
      GCP_ZONE: me-west1-b
      REGISTRY: me-west1-docker.pkg.dev/website-478708/or-on-platform
    concurrency:
      group: deploy-gcp-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment:
      name: development
      url: https://dev.or-on.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/157867817612/locations/global/workloadIdentityPools/github-oron-dev/providers/oron-crm-main
          service_account: oron-github-dev@website-478708.iam.gserviceaccount.com
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Create ephemeral DEV SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          key="${RUNNER_TEMP}/oron-dev-deploy"
          rm -f "${key}" "${key}.pub"
          ssh-keygen -t rsa -b 3072 -N "" -f "${key}" \
            -C "github-actions-oron-dev-${GITHUB_RUN_ID}"
          gcloud compute os-login ssh-keys add \
            --key-file="${key}.pub" --ttl=30m \
            --project="${GCP_PROJECT_ID}" --quiet
          echo "ORON_DEPLOY_SSH_KEY=${key}" >>"${GITHUB_ENV}"
      - name: Wait for DEV SSH authentication
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 12); do
            echo "SSH readiness attempt ${attempt}/12"
            if gcloud compute ssh "${DEV_VM}" --quiet --tunnel-through-iap \
              --ssh-key-file="${ORON_DEPLOY_SSH_KEY}" \
              --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" \
              --command="true"; then
              echo "DEV SSH authentication is ready"
              exit 0
            fi
            if (( attempt < 12 )); then
              sleep 10
            fi
          done
          echo "DEV SSH authentication never became ready" >&2
          exit 1
      - name: Assemble the release payload
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="${RUNNER_TEMP}/oron-dev-${GITHUB_SHA}"
          mkdir -p "${release_dir}"
          for service in web control-api messaging-worker dispatcher migrator; do
            digest="$(gcloud artifacts docker images describe \
              "${REGISTRY}/${service}:${GITHUB_SHA}" \
              --project website-478708 --format='value(image_summary.digest)')"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            variable="$(printf '%s' "${service}" | tr '[:lower:]-' '[:upper:]_')_IMAGE"
            printf '%s=%s@%s\n' "${variable}" "${REGISTRY}/${service}" "${digest}" \
              >>"${release_dir}/images.env"
          done
          cp --parents \
            infra/compose/deployment.yaml \
            infra/caddy/Caddyfile.deployment \
            infra/deployment/systemd/oron-dev.service \
            infra/deployment/systemd/oron-dev-backup.service \
            infra/deployment/systemd/oron-dev-backup.timer \
            scripts/deploy-dev.sh scripts/backup-dev.sh \
            "${release_dir}"
          archive="${RUNNER_TEMP}/oron-dev-release-${GITHUB_SHA}.tar.gz"
          tar -czf "${archive}" -C "${release_dir}" .
          echo "archive=${archive}" >>"${GITHUB_OUTPUT}"
          echo "archive_sha256=$(sha256sum "${archive}" | cut -d' ' -f1)" >>"${GITHUB_OUTPUT}"
          echo "deployer_sha256=$(sha256sum scripts/deploy-dev.sh | cut -d' ' -f1)" >>"${GITHUB_OUTPUT}"
      - name: Transfer and deploy the release
        shell: bash
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.release.outputs.archive_sha256 }}
          DEPLOYER_SHA256: ${{ steps.release.outputs.deployer_sha256 }}
        run: |
          set -Eeuo pipefail
          remote_archive="/tmp/oron-dev-release-${GITHUB_SHA}.tar.gz"
          remote_deployer="/tmp/oron-dev-deploy-${GITHUB_SHA}.sh"
          transfer_with_retry() {
            local source="$1"
            local destination="$2"
            local attempt
            for attempt in $(seq 1 5); do
              echo "SCP attempt ${attempt}/5: ${source}"
              if gcloud compute scp --quiet --tunnel-through-iap \
                --ssh-key-file="${ORON_DEPLOY_SSH_KEY}" \
                --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" \
                "${source}" "${destination}"; then
                return 0
              fi
              if (( attempt < 5 )); then
                sleep 10
              fi
            done
            echo "SCP failed after 5 attempts: ${source}" >&2
            return 1
          }
          transfer_with_retry "${ARCHIVE}" "${DEV_VM}:${remote_archive}"
          transfer_with_retry scripts/deploy-dev.sh "${DEV_VM}:${remote_deployer}"
          gcloud compute ssh "${DEV_VM}" --quiet --tunnel-through-iap \
            --ssh-key-file="${ORON_DEPLOY_SSH_KEY}" \
            --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" \
            --command="set -e; trap 'rm -f ${remote_archive} ${remote_deployer}' EXIT; test \"\$(sha256sum '${remote_deployer}' | cut -d' ' -f1)\" = '${DEPLOYER_SHA256}'; sudo bash '${remote_deployer}' '${GITHUB_SHA}' '${remote_archive}' '${ARCHIVE_SHA256}'"
      - name: Verify the public DEV endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 15 http://dev.or-on.io/)" = "308"
          curl --fail --silent --show-error --max-time 15 https://dev.or-on.io/login >/dev/null
      - name: Remove ephemeral DEV SSH key
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          key="${ORON_DEPLOY_SSH_KEY:-${RUNNER_TEMP}/oron-dev-deploy}"
          if [[ -f "${key}.pub" ]]; then
            gcloud compute os-login ssh-keys remove \
              --key-file="${key}.pub" --project="${GCP_PROJECT_ID}" --quiet || \
              echo "OS Login key removal failed; the 30-minute TTL remains in force" >&2
          fi
          rm -f "${key}" "${key}.pub"
