name: CI

on:
  pull_request:
  push:
    branches: [main, codex/phase-1-foundation]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENABLE_REAL_TELEPHONY: "false"
  ENABLE_REAL_WHATSAPP: "false"

jobs:
  typescript:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ebd50bdde86241dd1b03a5b0a54a71aee9a1ca80 # v6.0.1
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: Python workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.7
          python-version: 3.14.7
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff format --check packages/py services/py db scripts
      - run: uv run ruff check packages/py services/py db scripts
      - run: uv run pyrefly check packages/py services/py db scripts
      - run: uv run pytest -p no:cacheprovider
      - run: uv run pip-audit

  database:
    name: PostgreSQL and Alembic
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: or_on_platform_ci
          POSTGRES_USER: platform_migrator
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_migrator -d or_on_platform_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://platform_migrator:ci-only-password@127.0.0.1:5432/or_on_platform_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.7
          python-version: 3.14.7
      - run: uv sync --all-packages --locked
      - run: uv run alembic -c db/alembic/alembic.ini upgrade head
      - run: uv run alembic -c db/alembic/alembic.ini current --check-heads
      - run: uv run pytest -p no:cacheprovider db/tests/test_migration_graph.py

  contracts:
    name: Contract freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ebd50bdde86241dd1b03a5b0a54a71aee9a1ca80 # v6.0.1
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.7
          python-version: 3.14.7
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: pnpm contracts:check

  architecture-security:
    name: Architecture and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ebd50bdde86241dd1b03a5b0a54a71aee9a1ca80 # v6.0.1
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.7
          python-version: 3.14.7
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: uv run python scripts/check_repository.py
      - run: uv run python scripts/check_secrets.py
      - run: uv run python scripts/check_docs.py
      - run: pnpm peers check
      - run: pnpm audit --audit-level critical
      - run: uv run pip-audit

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - run: docker compose --env-file .env.example -f infra/compose/compose.yaml --profile core config
      - run: docker build --file services/py/control-api/Dockerfile --tag or-on/control-api:ci .
      - run: docker build --file apps/web/Dockerfile --tag or-on/web:ci .
