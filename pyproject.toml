[project]
name = "or-on-platform"
version = "0.1.0"
description = "Unified Or-On Platform Python workspace"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "alembic==1.19.1",
  "cryptography==50.0.1",
  "httpx==0.28.1",
  "pip-audit==2.10.1",
  "pyrefly==1.2.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/py/oron-common",
  "packages/py/oron-db",
  "packages/py/oron-dispatcher",
  "packages/py/oron-flows",
  "packages/py/oron-secrets",
  "packages/py/oron-sessions",
  "packages/py/oron-tenancy",
  "packages/py/platform-integration",
  "services/py/control-api",
  "services/py/dispatcher",
  "services/py/voice-agent",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["packages/ts", "services/ts", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
# FastAPI intentionally declares dependency markers in parameter defaults.
"packages/py/oron-sessions/src/oron_sessions/api.py" = ["B008", "B904"]
"packages/py/oron-sessions/src/oron_sessions/deps.py" = ["B008"]
"packages/py/oron-tenancy/src/oron_tenancy/router.py" = ["B008", "B904"]
"services/py/control-api/src/control_api/voice.py" = ["B008"]
# Preserved source translates driver/provider failures into domain errors.
"packages/py/oron-sessions/src/oron_sessions/artifacts.py" = ["B904"]
"packages/py/oron-sessions/src/oron_sessions/campaigns.py" = ["B904"]
"packages/py/oron-tenancy/src/oron_tenancy/admission.py" = ["B904"]
"packages/py/oron-tenancy/src/oron_tenancy/security.py" = ["B904"]
"packages/py/oron-tenancy/tests/test_provisioner.py" = ["B017"]
"packages/py/oron-dispatcher/src/oron_dispatcher/webhook.py" = ["B008"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["packages/py", "services/py", "db/tests", "db/importers", "scripts/tests"]
pythonpath = ["."]
markers = [
  "integration: exercises multiple repository/database boundaries",
  "migration: validates Alembic history or schema state",
  "postgres: requires a real disposable PostgreSQL 18.6 database",
  "rls: validates PostgreSQL row-level security behavior",
]

[tool.pyrefly]
project-includes = ["packages/py/*/src", "services/py/*/src"]
project-excludes = [
  "**/__pycache__",
  "**/.venv",
  "**/tests/**",
  "db/alembic/versions/**",
]

[tool.pyrefly.errors]
# SQLModel exposes ``__tablename__`` as a descriptor on the declarative base,
# while concrete table models correctly declare a string. This is a stub-level
# false positive also documented by the retained Or-on workspace.
bad-override = false
