[project]
name = "oron-sessions"
version = "0.1.0"
description = "Voice session and campaign persistence retained from Or-on"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "google-cloud-kms==3.16.0",
  "google-cloud-storage==3.13.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "oron-common",
  "oron-db",
  "oron-flows",
  "oron-secrets",
  "oron-tenancy",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "sqlalchemy[asyncio]==2.0.52",
  "sqlmodel==0.0.42",
  "tzdata==2026.3",
  "uvicorn[standard]==0.52.4",
]

[project.scripts]
oron-sessions = "oron_sessions.app:main"
oron-sessions-sweeper = "oron_sessions.sweeper:main"

[tool.uv.sources]
oron-common = { workspace = true }
oron-db = { workspace = true }
oron-flows = { workspace = true }
oron-secrets = { workspace = true }
oron-tenancy = { workspace = true }

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"
