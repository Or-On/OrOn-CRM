[project]
name = "or-on-platform-integration"
version = "0.1.0"
description = "New cross-system configuration and infrastructure integration"
requires-python = ">=3.14,<3.15"
dependencies = [
  "asyncpg==0.31.0",
  "pyjwt==2.13.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.52",
]

[build-system]
requires = ["uv-build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "or_on_platform"
