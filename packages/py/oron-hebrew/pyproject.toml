[project]
name = "oron-hebrew"
version = "0.1.0"
description = "Retained Or-on Hebrew normalization and voice-model adapters"
requires-python = ">=3.14,<3.15"
dependencies = [
  "loguru==0.7.3",
  "oron-common==0.1.0",
  "pipecat-ai==1.8.1",
  "renikud-plus[cpu]==0.5.0",
]

[project.optional-dependencies]
gender = ["safetensors==0.8.0", "torch==2.13.0", "torchaudio==2.11.0"]

[build-system]
requires = ["uv-build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
oron-common = { path = "../oron-common", editable = true }

[tool.uv.build-backend]
module-name = "oron_hebrew"
